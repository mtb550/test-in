####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-jvm

# The project's own profile, the one the IDE selects through
# .idea/inspectionProfiles/profiles_settings.xml and the one tools/inspect.ps1
# hands the headless inspector. Qodana reads an IntelliJ XML profile from a path
# as readily as it reads one of its own by name, so the three now ask the same
# question of the same rules.
#
# It was qodana.recommended until then, and that profile turns on inspections
# this project has switched off on purpose. The first cloud report was 91
# findings, 86 of them OptionalUsedAsFieldOrParameterType. A field holding an
# Optional is how a Testin field says "not set yet", so the profile below
# disables that inspection. CLAUDE.md says turning it back on means reversing
# the decision rather than tidying up. A gate that reports 86 things nobody
# will ever change is a gate nobody reads.
#
# UnusedProperty is off for the same reason, and the evidence is stronger. It
# reported 176 findings over 60 keys, and every one of the 60 is an action.,
# group. or toolwindow. key. The platform composes those at runtime from a
# plugin.xml id, so no Bundle.message call names them and no inspection can see
# them read. BundleKeysTest already owns the question.
# everyKeyInTheBundleIsAskedForSomewhere fails on an unreferenced key and skips
# exactly those three prefixes; everyDeclaredActionIsNamedInTheBundle fails when
# a declared action has no action.<id>.text key at all. So the inspection was
# reporting as dead the keys a test demands exist.
#
# SplitModeApiUsage, SplitModeXmlApiUsage and UseOptimizedEelFunctions are off
# too, decided 1 October 2026. They ran once the Gradle import was whole and
# reported 66 of the 121 findings on 51f5a9e1. Split Mode asks for the plugin to
# be cut into frontend and backend modules so it can run under JetBrains remote
# development; Testin runs in one IDE process and remote development is not a
# target, so an issue for it brings these back if it ever is. Eel asks file
# reads and writes to go through the remote-environment Eel API, and that API is
# mostly @ApiStatus.Internal or Experimental - the verifier gate in
# build.gradle.kts fails on both, so following the advice would break the build.
profile:
  path: .idea/inspectionProfiles/Testin.xml

include:
  - name: CheckDependencyLicenses

# The one list of exceptions. Qodana reads it here, and tools/inspect.ps1 reads
# the same entries, so the CI report and the inspection gate cannot disagree
# about what is excused. Every entry names the narrowest path it can, and says
# why nothing better is possible. Anything not listed fails the gate.
exclude:
  # Files whose bytes something else owns.
  #
  # samples/testin-root marks a test set with a file named .ts, which is also
  # TypeScript's extension. The marker is JSON, so reading it as TypeScript
  # gives fifteen syntax errors per file. .ts is the marker Testin writes.
  #
  # gradlew and gradlew.bat are written by Gradle's wrapper task. EULA.md and
  # PRIVACY_POLICY.md are JetBrains' agreements quoted verbatim.
  #
  # The documentation site's Jekyll files: the stylesheet opens with the front
  # matter Jekyll needs and imports {{ site.theme }}, which is not CSS, and the
  # head include loads Mermaid from its CDN, which is how a static page gets
  # it.
  #
  # The bug report template is the body of every issue Testin files, pinned
  # byte for byte by BugTemplateTest.
  - name: All
    paths:
      - samples
      - gradlew
      - gradlew.bat
      - EULA.md
      - PRIVACY_POLICY.md
      - docs/assets/css/style.scss
      - docs/_includes/head-custom.html
      - src/main/resources/org/testin/bug/bugReport.md

  # GitCommandRunnerTest proves a credential in a remote URL is masked before
  # Git's message reaches the log, so its test data has to be a URL with a
  # password in it. Every one is fake.
  - name: HardcodedPasswords
    paths:
      - src/test/java/org/testin/git/GitCommandRunnerTest.java

  # An action's inputs are declared in its action.yml online, which an offline
  # inspector cannot fetch, so every with: key reads as undefined.
  - name: UndefinedParamsPresent
    paths:
      - .github/workflows

  # CodeNavigation's real implementation lives in testin-java, a content module
  # the inspector cannot see, so it judges "every implementation" by the
  # no-Java fallback alone, which always answers false.
  - name: SameReturnValue
    paths:
      - src/main/java/org/testin/navigate/CodeNavigation.java
