# Sharing work with the team (#11): the review, the sync, the conflicts and
# the branch box. Every progress title a background task shows, every balloon
# it raises, and every sentence a conflict is explained in.
#
# A count is passed as digits, not as a number, everywhere below. MessageFormat
# would group one into 1,234 - which is a different sentence from the one these
# have always printed.
#
# Git's own output is not here. A message that arrives from git as {0} stays in
# whatever language git speaks; what is translated is the sentence Testin wrote
# around it.
