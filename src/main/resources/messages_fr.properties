# The last of it (#11): the bulk editors, light mode's parts, the two editor
# descriptions, and the words the toolbar and the runner say.
#
# EditorType's two NAMES are not here and never will be. A FileType's getName()
# is its identity - unique among every file type in the IDE, and written down
# when the IDE remembers a file-type association - so a translated one would
# give the type a different identity in every language. The descriptions beside
# them are the localizable half, and the platform says so by annotating them.
#
# Level's seven names are not here either. OFF, TRACE, DEBUG, INFO, WARN, ERROR
# and FATAL are written into the log file as well as shown in the settings
# combo, and a log a colleague reads should not change shape with the reader.
