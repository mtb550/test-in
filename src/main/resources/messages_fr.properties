# Automation code, and the sync that goes over a server (#11).
#
# GenType's tooltip is not here. It reads like a caption and is only ever
# written to the log - so is NoOpCodeUpdate's field name, and so is the
# "what failed" half of the SFTP reporter. What a log says is not read by a
# tester and is not worth translating.
#
# SftpSecret's descriptions are not here either, and must not be: they are
# part of the key a password is stored under in this machine's keychain.
# Translating one loses every password already kept under the old spelling.
