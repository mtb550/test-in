# The model's vocabulary, the tree panel, the settings page and the indexer
# (#11).
#
# TestRunConfiguration's OPTIONS are not here, and must not be. What a tester
# picks from those lists is written into the run's JSON and read back by
# TestRunConfiguration.is(...) - so "Web" and "Frontend" are stored data and a
# cross-field rule, not words. The field names above them are words, and those
# are here.
#
# A plural is two keys, never a sentence with an s appended. French does not
# make a plural by adding a letter to the end of every noun, and does not
# pluralize at the same count English does.
