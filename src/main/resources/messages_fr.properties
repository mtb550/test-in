refused.already.running=%s est déjà en cours
refused.while.indexing=%s attend que l'IDE termine son indexation
refused.not.a.repository.url='%s' n'est pas une adresse de dépôt
refused.not.an.email.address='%s' n'est pas une adresse e-mail
refused.not.a.java.name='%s' ne peut pas nommer un paquet Java
refused.no.test.case.behind.it=%s a été généré depuis un cas de test qui n'existe plus
refused.unreadable=Impossible de lire %s, donc ce qui y était est resté
