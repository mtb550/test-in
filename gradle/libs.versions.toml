[versions]
lombok = "1.18.44"
jackson = "2.22.2"
testng = "7.12.0"
iText = "9.6.0"
fastexcel = "0.20.0"
poi = "5.5.1"
jsch = "2.28.7"
sshd = "2.19.0"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
testng = { module = "org.testng:testng", version.ref = "testng" }
iText-kernel = { module = "com.itextpdf:kernel", version.ref = "iText" }
iText-layout = { module = "com.itextpdf:layout", version.ref = "iText" }
fastexcel = { module = "org.dhatim:fastexcel", version.ref = "fastexcel" }
poi = { module = "org.apache.poi:poi", version.ref = "poi" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
sshd-core = { module = "org.apache.sshd:sshd-core", version.ref = "sshd" }
sshd-sftp = { module = "org.apache.sshd:sshd-sftp", version.ref = "sshd" }
