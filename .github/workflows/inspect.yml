# The IDE inspections, on a push to main.
#
# They cost a full indexing pass - fifteen to twenty minutes - which is why this
# is not part of build.yml and why nobody runs it by hand: a gate that takes
# twenty minutes is one that gets skipped, and a gate that gets skipped is not a
# gate. A push is the right moment for it - the code is finished, and nothing is
# waiting on the answer.
#
# It was on a two-day schedule until 2026-09-12. A calendar runs it over code
# nobody touched and misses the push that mattered; this runs it over exactly
# what arrived, and the run is read afterwards rather than waited on.
#
# It gates on eight findings, ratchets a ninth, and lists the rest.
#
# DataFlowIssue and ReturnNull are the standing rule: a null contract the checker
# can prove is broken is a defect, not a style note.
#
# The other six are the script's own, because no IntelliJ inspection makes them.
# WrappedMethodDeclaration - a method declaration belongs on one line.
# StaticMutableState - a static that is not final in the packages that model the
# data is one slot for the whole IDE, which is how a cached test source root came
# to be shared between projects. HandWrittenPrivateConstructor - an empty one
# where @NoArgsConstructor(access = PRIVATE) says it better. DriftedCaption - one
# concept spelled two ways in front of the same tester. OrphanedJavadoc - a doc
# block followed by a second one, which javac throws away. MissingCopyright - a
# .java file that does not open with the Apache 2.0 notice, so a file read away
# from the repository says nothing about who owns it. All six are at zero, so the
# first one that appears is the one to look at.
#
# DuplicatedDisplayString is counted rather than forbidden: a string a tester
# reads that another file also writes has no owner, and there were 304 of them
# when the check was written. .github/display-string-baseline.txt records the
# number, a rise fails the run and a fall is reported so the number can follow it
# down - the same ratchet verify.yml gives the Plugin Verifier.
#
# Everything else needs a person and is listed in the artifact.
name: Inspect

on:
  push:
    branches:
      - main

  # So it can be run against a branch before the branch lands.
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. Two pushes a minute apart would otherwise start two
# twenty-minute inspections of nearly the same tree, and only the later answer
# is about code that still exists.
concurrency:
  group: inspect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out the commit
        uses: actions/checkout@v7

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      # The inspector is the IDE the Gradle plugin downloads, pinned by
      # intellij.version - so this step is what puts it on disk. inspect.ps1
      # finds it under GRADLE_USER_HOME, which the action above sets.
      - name: Fetch the IDE the inspector runs from
        shell: bash
        run: ./gradlew compileJava

      # src, not src/main: the test tree had never been inspected until it was
      # asked for by name, and the first run over it found three tests that
      # could not fail. Never the project root - .sandbox holds a whole IDE
      # installation, and inspecting it produced 74,803 spellcheck findings.
      #
      # Run as its own process so its exit code is this step's: the script
      # exits 1 when the gate is breached.
      - name: Inspect
        shell: bash
        # No -Subdirectory. It said 'src', which is not the source: it swept
        # src/test in with src/main - 212 of 385 findings were test fixtures,
        # where a literal expectation is the point rather than a divergence -
        # and it left out testin-java and testin-testng altogether, which is
        # the gap Get-SourceRoots was written to close. Without the argument
        # the script uses those three production trees and nothing else.
        #
        # That last sentence was written before it was true: the parameter had a
        # default, so the branch reading all three roots was unreachable and
        # only src/main was ever checked. Fixed in #170.
        run: ./gradlew inspect

      # Always, because a breached gate is exactly when somebody wants the list.
      - name: Keep the findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inspection
          if-no-files-found: ignore
          path: |
            .inspection/summary.txt
            .inspection/findings.txt
