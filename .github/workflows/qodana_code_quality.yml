name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis

      - name: Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      # The two content modules compile against the core jar, so the scan
      # resolves them to a jar that nothing had built. Their classes came out
      # unresolved, which is where the unchecked warnings and the Java sanity
      # errors in the first report came from. This is the same command
      # inspect.yml runs, and it builds that jar on the way.
      - name: Build the jar the content modules compile against
        run: ./gradlew compileJava

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          pr-mode: false
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1276862442 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'