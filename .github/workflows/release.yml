# A tag publishes to the JetBrains Marketplace, signed, with no local machine
# involved. The signing and publishing configuration already lives in
# build.gradle.kts and reads four environment variables; this supplies them from
# repository secrets.
#
# Required secrets, the same four names the build file reads:
#   CERTIFICATE_CHAIN  PRIVATE_KEY  PRIVATE_KEY_PASSWORD  JETBRAINS_TOKEN
name: Release

on:
  push:
    # Every tag this project has ever carried is the bare version - 2.6,
    # 2.8.0-alpha, 2.9.1-alpha. This pattern matched none of them: it wanted a
    # leading v, so the only tag that ever reached this workflow was the one
    # that broke the convention, and every release tagged the usual way did
    # nothing at all.
    tags: ['[0-9]*']

permissions:
  contents: read

jobs:
  publish:
    name: Sign and publish
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the tag
        uses: actions/checkout@v7

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      # The Marketplace takes a version string once and never again, so a tag
      # that disagrees with the version in build.gradle.kts is caught here
      # rather than by an upload that cannot be undone.
      - name: The tag and the version agree
        shell: bash
        run: |
          declared=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          tagged=$GITHUB_REF_NAME

          if [ "$declared" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME asks to publish $tagged, but build.gradle.kts declares $declared."
            echo "Move the version in build.gradle.kts, or tag $declared."
            exit 1
          fi

          echo "Publishing $declared"

      # Tested and verified before it is signed. publishPlugin builds and signs
      # on its own but runs no tests, and a published version cannot be pulled
      # back.
      #
      # verifyDistribution is in the same line and before publishPlugin on
      # purpose: it opens the built zip and fails on a test class or a
      # compile-only dependency, and the one moment that check is worth
      # anything is the moment before an upload nobody can undo (#171).
      - name: Test, verify the distribution, sign and publish
        shell: bash
        run: ./gradlew test verifyPlugin verifyDistribution publishPlugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}

      - name: Keep the signed distribution
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distribution
          if-no-files-found: ignore
          path: build/distributions/*.zip
